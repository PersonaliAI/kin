name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: python -m compileall -q main.py app plugins
      - run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      # Non-blocking: the current eslint-config-next version enforces newer
      # react-hooks rules (e.g. set-state-in-effect) that predate this CI
      # setup and exist across many files. Surfacing them without failing
      # the build until they're cleaned up incrementally — see CONTRIBUTING.md.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
        env:
          # Dummy values so build-time prerendering of pages that construct a
          # Supabase client doesn't fail in CI, which has no real project.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  voice-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: voice-worker/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: python -m compileall -q worker.py
      - run: python -m pytest tests/ -q
